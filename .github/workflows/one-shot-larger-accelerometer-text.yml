name: one-shot enlarge accelerometer text

on:
  push:
    branches: [accelerometer/larger-text]
    paths: [.github/workflows/one-shot-larger-accelerometer-text.yml]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accelerometer/larger-text
      - name: Enlarge text only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('accelerometer/app/src/main/c/native_main.c')
          text = path.read_text()

          anchor = "    int32_t left = 6 * scale;\n"
          replacement = "    int32_t text_scale = scale + 1;\n\n    int32_t left = 6 * scale;\n"
          if text.count(anchor) != 1:
              raise SystemExit('layout anchor did not match exactly once')
          text = text.replace(anchor, replacement, 1)

          replacements = {
              'draw_text(&buffer, "ACCELEROMETER", left, top, scale, foreground);':
                  'draw_text(&buffer, "ACCELEROMETER", left, top, text_scale, foreground);',
              'draw_text(&buffer, "NO SENSOR", left, top + 2 * line_height, scale, foreground);':
                  'draw_text(&buffer, "NO SENSOR", left, top + 2 * line_height, text_scale, foreground);',
              'draw_text(&buffer, x_line, left, top + 2 * line_height, scale, foreground);':
                  'draw_text(&buffer, x_line, left, top + 2 * line_height, text_scale, foreground);',
              'draw_text(&buffer, y_line, left, top + 4 * line_height, scale, foreground);':
                  'draw_text(&buffer, y_line, left, top + 4 * line_height, text_scale, foreground);',
              'draw_text(&buffer, z_line, left, top + 6 * line_height, scale, foreground);':
                  'draw_text(&buffer, z_line, left, top + 6 * line_height, text_scale, foreground);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm .github/workflows/one-shot-larger-accelerometer-text.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add accelerometer/app/src/main/c/native_main.c .github/workflows/one-shot-larger-accelerometer-text.yml
          git commit -m 'Make accelerometer display text larger'
          git push origin HEAD:accelerometer/larger-text
