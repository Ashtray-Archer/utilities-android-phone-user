name: Programmer's Unicode Picker Android

on:
  pull_request:
    paths:
      - 'math-characters/**'
      - '.github/workflows/math-characters-apk.yml'
  push:
    branches: [main]
    paths:
      - 'math-characters/**'
      - '.github/workflows/math-characters-apk.yml'

permissions:
  contents: read

jobs:
  idric-layout-contract:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      ANDROID_KEYSTORE_PASSWORD: wegert-debug
      ANDROID_KEY_PASSWORD: wegert-debug
      ANDROID_KEY_ALIAS: wegert-debug
      ANDROID_EXPECTED_CERT_SHA256: DE:9B:1D:47:C5:A6:5E:6D:46:A2:04:B7:9D:D9:EE:56:6B:9D:3C:98:32:BA:81:EB:C4:21:3D:33:92:E9:2F:F9
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v6
        with:
          repository: isomorphisms/Idric
          ref: d93b5cf538836325812813e81c2dfdac159397b0
          path: idric-compiler

      - name: Restore pinned Idriç compiler
        id: idric-cache
        uses: actions/cache@v4
        with:
          path: |
            idric-compiler/.tools
            idric-compiler/bootstrap-build
            idric-compiler/build/exec
          key: idric-${{ runner.os }}-${{ runner.arch }}-d93b5cf538836325812813e81c2dfdac159397b0

      - name: Build pinned Idriç compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        run: idric-compiler/edric bootstrap

      - name: Check Idriç picker model and generated layouts
        run: |
          PATH="$PWD/idric-compiler/.tools/bin:$PATH" \
          IDRIS2_PATH="$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/prelude-0.8.0:$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/base-0.8.0" \
          IDRIS2_DATA="$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/support" \
          IDRIS2_LIBS="$PWD/idric-compiler/bootstrap-build/idris2-0.8.0/lib" \
          IDRIC_COMPILER="$PWD/idric-compiler/build/exec/idris2" \
          math-characters/check-idric-layouts.sh

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Test C model and touch geometry
        run: math-characters/run-host-tests.sh

      - name: Build native APK
        run: math-characters/build-apk.sh

      - name: Verify native APK contract
        run: math-characters/ci/check-apk.sh math-characters/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: programmers-unicode-pad-debug-apk
          path: math-characters/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: programmers-unicode-pad-debug-apk
          path: downloaded-apk

      - name: Launch and exercise native picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: math-characters/ci/emulator-smoke.sh downloaded-apk/app-debug.apk /tmp/programmers-unicode-pad.png

      - name: Upload smoke-test screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: programmers-unicode-pad-smoke-screen
          path: /tmp/programmers-unicode-pad.png
          if-no-files-found: warn
