name: Android clipboard JNI

on:
  pull_request:
    paths:
      - 'android-clipboard/**'
      - '.github/workflows/android-clipboard-jni.yml'
  push:
    branches: [main]
    paths:
      - 'android-clipboard/**'
      - '.github/workflows/android-clipboard-jni.yml'

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check UTF-8 ownership and JNI boundary
        run: android-clipboard/run-host-tests.sh

  device-smoke-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Build DEX-free clipboard smoke APK
        run: ANDROID_ABI=x86_64 sh android-clipboard/device-smoke/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-smoke-x86_64
          path: android-clipboard/device-smoke/build/clipboard-smoke-x86_64.apk
          if-no-files-found: error

  device-smoke:
    needs: device-smoke-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: clipboard-smoke-x86_64
          path: downloaded-apk
      - name: Exercise ClipboardManager through native bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: sh android-clipboard/device-smoke/run-device-smoke.sh downloaded-apk/clipboard-smoke-x86_64.apk
