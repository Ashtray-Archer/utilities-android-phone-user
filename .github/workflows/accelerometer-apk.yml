name: accelerometer native APK

on:
  push:
    branches: [accelerometer/native-apk]
    paths:
      - 'accelerometer/**'
      - '.github/workflows/accelerometer-apk.yml'
  pull_request:
    paths:
      - 'accelerometer/**'
      - '.github/workflows/accelerometer-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      ANDROID_KEYSTORE_PASSWORD: wegert-debug
      ANDROID_KEY_PASSWORD: wegert-debug
      ANDROID_KEY_ALIAS: wegert-debug
      ANDROID_EXPECTED_CERT_SHA256: DE:9B:1D:47:C5:A6:5E:6D:46:A2:04:B7:9D:D9:EE:56:6B:9D:3C:98:32:BA:81:EB:C4:21:3D:33:92:E9:2F:F9
    steps:
      - uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK inputs
        run: |
          yes | sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018'

      - name: Build native APK
        run: |
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            sh accelerometer/build-apk.sh

      - name: Inspect APK and ARMv7 Thumb library
        run: |
          set -eu
          apk=accelerometer/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -l "$apk"
          if unzip -l "$apk" | grep -q 'classes.dex'; then
            echo 'unexpected classes.dex in native accelerometer APK' >&2
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            unzip -p "$apk" "lib/$abi/libaccelerometer.so" >"/tmp/libaccelerometer-$abi.so"
            file "/tmp/libaccelerometer-$abi.so"
          done
          readelf -A /tmp/libaccelerometer-armeabi-v7a.so | tee /tmp/arm-attributes.txt
          grep -Eq 'Tag_CPU_arch: v7|Tag_CPU_arch: v7E-M' /tmp/arm-attributes.txt
          grep -q 'Tag_THUMB_ISA_use: Thumb-2' /tmp/arm-attributes.txt

      - name: Retain APK
        uses: actions/upload-artifact@v4
        with:
          name: accelerometer-native-apk
          path: accelerometer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  replacement-install:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: accelerometer-native-apk
          path: downloaded-apk

      - name: Install and replace without uninstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk
            adb shell am start -W -n com.ashtrayarcher.accelerometer/android.app.NativeActivity | tee /tmp/accelerometer-start.txt
            grep -Fq 'Status: ok' /tmp/accelerometer-start.txt
            test -n "$(adb shell pidof com.ashtrayarcher.accelerometer | tr -d '\r')"
