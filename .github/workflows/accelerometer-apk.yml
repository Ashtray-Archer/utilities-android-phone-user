name: accelerometer native packages

on:
  push:
    branches: [accelerometer/native-apk]
    paths:
      - 'accelerometer/**'
      - 'geometry/**'
      - 'icky/**'
      - '.github/workflows/ick-compilers.yml'
      - '.github/workflows/accelerometer-apk.yml'
  pull_request:
    paths:
      - 'accelerometer/**'
      - 'geometry/**'
      - 'icky/**'
      - '.github/workflows/ick-compilers.yml'
      - '.github/workflows/accelerometer-apk.yml'

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  build:
    needs: compilers
    runs-on: ubuntu-24.04

    env:
      ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      ANDROID_KEYSTORE_PASSWORD: wegert-debug
      ANDROID_KEY_PASSWORD: wegert-debug
      ANDROID_KEY_ALIAS: wegert-debug
      ANDROID_EXPECTED_CERT_SHA256: DE:9B:1D:47:C5:A6:5E:6D:46:A2:04:B7:9D:D9:EE:56:6B:9D:3C:98:32:BA:81:EB:C4:21:3D:33:92:E9:2F:F9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out shared ICK source producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 4ea071a96239f3a29ca6d98454feb59947d87cfe
          path: .ai-ci-ick
      - name: Download qualified compiler stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: build/ick-packages
          merge-multiple: true
      - name: Restore qualified compiler stages
        run: |
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-armeabi-v7a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-arm64-v8a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=x86_64 ICK_STAGE="$GITHUB_WORKSPACE/build/ick/x86_64" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-x86_64.tar.gz"

      - name: Qualify owned host C producer
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Test compact geometric state
        run: make -f icky/Host.mk model-tests ICK="${{ steps.ick.outputs.compiler }}"

      - name: Check out stable public test signer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK inputs
        run: |
          yes | sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018'

      - name: Install app-bundle tools
        run: |
          set -eu
          tools="$RUNNER_TEMP/accelerometer-bundle-tools"
          mkdir -p "$tools"

          curl -fL --retry 3 \
            -o "$tools/bundletool.jar" \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar'
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$tools/bundletool.jar" | sha256sum -c -

          curl -fL --retry 3 \
            -o "$tools/aapt2.jar" \
            'https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/9.4.1-15978811/aapt2-9.4.1-15978811-linux.jar'
          mkdir -p "$tools/aapt2"
          unzip -q "$tools/aapt2.jar" -d "$tools/aapt2"
          chmod +x "$tools/aapt2/aapt2"

          echo "BUNDLETOOL_JAR=$tools/bundletool.jar" >> "$GITHUB_ENV"
          echo "BUNDLE_AAPT2=$tools/aapt2/aapt2" >> "$GITHUB_ENV"

      - name: Build native APKs
        run: |
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            sh accelerometer/build-apk.sh

      - name: Build native app bundle
        run: |
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            sh accelerometer/build-bundle.sh

      - name: Verify declared source producers
        uses: isomorphisms/ai-ci@4ea071a96239f3a29ca6d98454feb59947d87cfe
        with:
          suite: ci/build-toolchain-suite.tsv
          root: .

      - name: Inspect APKs and ARMv7 Thumb library
        run: |
          set -eu
          debug_apk=accelerometer/app/build/outputs/apk/debug/app-debug.apk
          distribution=accelerometer/app/build/outputs/apk/distribution
          test -f "$debug_apk"

          if unzip -Z1 "$debug_apk" | grep -q 'classes.dex'; then
            echo 'unexpected classes.dex in native accelerometer APK' >&2
            exit 1
          fi

          for abi in armeabi-v7a arm64-v8a x86_64; do
            unzip -p "$debug_apk" "lib/$abi/libaccelerometer.so" >"/tmp/libaccelerometer-$abi.so"
            file "/tmp/libaccelerometer-$abi.so"
          done

          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$distribution/accelerometer-$abi.apk"
            test -f "$apk"
            test "$(unzip -Z1 "$apk" | grep -Ec '^lib/[^/]+/libaccelerometer[.]so$')" -eq 1
            unzip -Z1 "$apk" | grep -qx "lib/$abi/libaccelerometer.so"
            if unzip -Z1 "$apk" | grep -q 'classes.dex'; then
              echo "unexpected classes.dex in $apk" >&2
              exit 1
            fi
            unzip -p "$apk" "lib/$abi/libaccelerometer.so" >"/tmp/distribution-$abi.so"
            if readelf -S "/tmp/distribution-$abi.so" | grep -q '[.]debug_'; then
              echo "debug sections survived stripping in $apk" >&2
              exit 1
            fi
          done

          universal="$distribution/accelerometer-universal.apk"
          test -f "$universal"
          test "$(unzip -Z1 "$universal" | grep -Ec '^lib/[^/]+/libaccelerometer[.]so$')" -eq 3

          readelf -A /tmp/libaccelerometer-armeabi-v7a.so | tee /tmp/arm-attributes.txt
          grep -Eq 'Tag_CPU_arch: v7|Tag_CPU_arch: v7E-M' /tmp/arm-attributes.txt
          grep -q 'Tag_THUMB_ISA_use: Thumb-2' /tmp/arm-attributes.txt

          stat -c '%n %s bytes' \
            "$debug_apk" \
            "$distribution/accelerometer-armeabi-v7a.apk" \
            "$distribution/accelerometer-arm64-v8a.apk" \
            "$distribution/accelerometer-x86_64.apk" \
            "$universal"

      - name: Inspect app bundle
        run: |
          set -eu
          aab=accelerometer/app/build/outputs/bundle/distribution/accelerometer.aab
          test -f "$aab"
          java -jar "$BUNDLETOOL_JAR" validate --bundle="$aab"
          unzip -Z1 "$aab" | tee /tmp/accelerometer-aab-files.txt
          for abi in armeabi-v7a arm64-v8a x86_64; do
            grep -q "base/lib/$abi/libaccelerometer.so" /tmp/accelerometer-aab-files.txt
          done
          stat -c '%n %s bytes' "$aab"

      - name: Retain universal debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accelerometer-native-apk
          path: accelerometer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Retain direct-distribution APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accelerometer-distribution-apks
          path: accelerometer/app/build/outputs/apk/distribution/*.apk
          if-no-files-found: error

      - name: Retain app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accelerometer-app-bundle
          path: accelerometer/app/build/outputs/bundle/distribution/accelerometer.aab
          if-no-files-found: error

  replacement-install:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: accelerometer-native-apk
          path: downloaded-apk

      - name: Install exact candidate twice without uninstall
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk
            adb shell am start -W -n com.ashtrayarcher.accelerometer/android.app.NativeActivity | tee /tmp/accelerometer-start.txt
            grep -Fq 'Status: ok' /tmp/accelerometer-start.txt
            test -n "$(adb shell pidof com.ashtrayarcher.accelerometer | tr -d '\r')"
