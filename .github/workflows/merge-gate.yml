name: merge-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prove the checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected=${{ github.event.pull_request.head.sha }}
          actual=$(git rev-parse HEAD)
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Parse every maintained shell script
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 sh -n
