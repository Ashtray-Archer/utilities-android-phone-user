name: Green Grocer checked recipe runtime

on:
  pull_request:
    paths:
      - 'green-grocer/**'
      - 'examples/autogenerated/green-grocer-recipes/**'
      - '.github/workflows/green-grocer-recipes.yml'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 2bce7677f513d711875e978bd6f5ad28b9e54d58
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 6ab4818219efa7ea5eda137ca6b76976eb2a4d42
          path: .tools/android-NDK
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 14161714564
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@ebfb667b64009f0c0bdf9dcfafb7884196786ef5
      - name: Recover the qualified host compiler cache identity
        id: qualified_ick_cache
        run: grease/bin/grease .tools/android-NDK/dex/idric/qualified-compiler-cache.grease "$RUNNER_TEMP/ick-host-build/host-runtime-key-input.tsv" "$GITHUB_OUTPUT"
      - name: Preserve the qualified compiler before later consumer failures
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ick-host-stage
          key: ick-host-v1-${{ runner.os }}-${{ runner.arch }}-fbe86e23d55cfec2000c08e61deea2a407fd7175-${{ steps.qualified_ick_cache.outputs.runtime_key }}
      - name: Restore exact frontend bootstrap
        id: frontend
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: greengrocer-idric-2bce7677f513d711875e978bd6f5ad28b9e54d58-ick32cb-ubuntu24-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build pinned frontend through declared ICK bootstrap
        if: steps.frontend.outputs.cache-hit != 'true'
        env:
          CC: ${{ steps.ick.outputs.compiler }}
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: .tools/Idric/edric bootstrap
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.frontend.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.frontend.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Provision the pinned independent assembler
        run: grease/bin/grease green-grocer/_/prepare-recipe-tools.grease "$RUNNER_TEMP/recipe-tools"
      - name: Execute the independent unchanged C cart specimen
        run: grease/bin/grease green-grocer/_/check-cart-host.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ick-host-source" "${{ steps.ick.outputs.compiler }}" "$RUNNER_TEMP/cart-host"
      - name: Execute host checks and compile actual checked recipes and mutants
        run: grease/bin/grease green-grocer/_/prepare-recipe-art.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/grease/bin/grease" "$RUNNER_TEMP/recipe-tools/smali.jar" "$RUNNER_TEMP/recipe-acceptance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recipe-runtime-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recipe-acceptance
            ${{ runner.temp }}/recipe-tools
            ${{ runner.temp }}/cart-host
  art:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recipe-runtime-${{ github.event.pull_request.head.sha }}
          path: inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 14161714564
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@ebfb667b64009f0c0bdf9dcfafb7884196786ef5
      - name: Provision and verify the ART observer's runner dependency
        run: |
          grease/bin/grease -c 'sudo apt-get update -qq'
          grease/bin/grease -c 'sudo apt-get install -y --no-install-recommends ripgrep'
          grease/bin/grease -c 'rg --version'
      - name: Enable emulator acceleration
        run: grease/bin/grease -c 'sudo chmod 666 /dev/kvm'
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: grease/bin/grease green-grocer/_/observe-recipe-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/inputs/recipe-acceptance" "$RUNNER_TEMP/recipe-art" "${{ matrix.api }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recipe-art-api${{ matrix.api }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/recipe-art
