name: Pasteboard Android

on:
  pull_request:
  push:
    branches: [recover-pasteboard-20261101, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pasteboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  test-build:
    needs: compilers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
      ANDROID_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      ANDROID_KEYSTORE_PASSWORD: wegert-debug
      ANDROID_KEY_PASSWORD: wegert-debug
      ANDROID_KEY_ALIAS: wegert-debug
      ANDROID_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 4ea071a96239f3a29ca6d98454feb59947d87cfe
          path: .ai-ci-ick
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: 0e8cfdd1106ebdeffd01b6c519880ea3afc7dc35
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 035452331c0f2b98391a551e0797418da5793eae
          path: .tools/android-NDK
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: eafd7fa9e61138a664b205bf8ba82ec6837bbbb9
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: ba869518c7d850de6c47d8c6234654575e264e6c
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: build/ick-packages
          merge-multiple: true
      - name: Restore qualified Android compiler stages
        run: |
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-armeabi-v7a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-arm64-v8a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=x86_64 ICK_STAGE="$GITHUB_WORKSPACE/build/ick/x86_64" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-x86_64.tar.gz"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install declared Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Qualify owned host ICK compiler
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Build pinned Grease through its existing Cat Food bootstrap
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: sh .tools/catfood/build-tools.sh
      - name: Provision declared host dependencies
        run: ${{ env.GREASE }} .tools/android-NDK/examples/autogenerated/runtime-acceptance/prepare-host.grease
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: frontend-cache
        with:
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
          key: pasteboard-idric-0e8cfdd1106ebdeffd01b6c519880ea3afc7dc35-ick-fbe86e23d55cfec2000c08e61deea2a407fd7175-ubuntu24-x86_64-v1
      - name: Bootstrap pinned current Idriç with qualified ICK
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Preserve original migration fixture tests
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: make -f icky/Host.mk pasteboard-tests
      - name: Test shared JNI, durable storage and text framing
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: make -f icky/Host.mk clipboard-tests pasteboard-store-tests
      - name: Compile checked semantics and typed platform DEX
        run: ${{ env.GREASE }} pasteboard/build-checked.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/android-NDK" "$GITHUB_WORKSPACE/build/pasteboard-checked"
      - name: Package ABI-specific signed APKs through canonical producer
        run: ${{ env.GREASE }} pasteboard/build-apk.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/android-NDK" "$ANDROID_HOME" "$GITHUB_WORKSPACE/build/pasteboard-checked" "$GITHUB_WORKSPACE/build/pasteboard-apks"
      - name: Retain Grease execution environment for independent emulator steps
        run: ${{ env.GREASE }} -c 'tar -czf build/pasteboard-grease.tar.gz .tools/runtime/.build/grease .tools/runtime/grease/source'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pasteboard-build-evidence
          path: |
            build/pasteboard-checked
            build/pasteboard-apks
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pasteboard-candidate-apks
          path: |
            build/pasteboard-apks/*.apk
            build/pasteboard-apks/*.sha256
            build/pasteboard-apks/*.tsv
            build/pasteboard-apks/*commit.txt
            build/pasteboard-apks/digests.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pasteboard-grease
          path: build/pasteboard-grease.tar.gz
          if-no-files-found: error

  emulator-smoke:
    needs: test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    env:
      GREASE: ${{ github.workspace }}/.tools/runtime/.build/grease/bin/grease
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pasteboard-candidate-apks
          path: downloaded-apks
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pasteboard-grease
          path: downloaded-tools
      - name: Restore pinned Grease runtime
        run: tar -xzf downloaded-tools/pasteboard-grease.tar.gz
      - name: Enable emulator KVM
        run: ${{ env.GREASE }} -c 'sudo chmod a+rw /dev/kvm'
      - name: Execute installed checked model, restart and replacement
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ${{ env.GREASE }} pasteboard/ci/emulator-smoke.grease "$GITHUB_WORKSPACE/downloaded-apks/pasteboard-x86_64.apk" "$ANDROID_HOME/platform-tools/adb" "$GITHUB_WORKSPACE/build/emulator-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pasteboard-emulator-api${{ matrix.api }}
          path: build/emulator-evidence
          if-no-files-found: warn
